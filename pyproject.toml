[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tv-static-gif"
version = "0.2.0"
description = "Generate animated TV-static GIFs with Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["gif", "television", "static", "noise", "animation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/your-username/tv-static-gif"
Issues = "https://github.com/your-username/tv-static-gif/issues"

[project.scripts]
tv-static-gif = "tv_static_gif.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tv_static_gif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
